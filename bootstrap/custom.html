<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom Blog</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bs-primary: #ff5722;
      --bs-font-sans-serif: 'Poppins', sans-serif;
    }
  </style>
</head>
<body>
  <header class="bg-primary text-white text-center py-4">
    <h1>TechTalk Blog</h1>
  </header>

  <div class="container my-5">
    <div class="row g-4">
      <div class="col-md-6">
        <div class="card shadow">
          <div class="card-body">
            <h3 class="card-title text-primary">AI Trends 2025</h3>
            <p class="card-text">Latest updates in artificial intelligence and automation.</p>
            <a href="#" class="btn btn-primary">Read More</a>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card shadow">
          <div class="card-body">
            <h3 class="card-title text-primary">Web Dev Insights</h3>
            <p class="card-text">Bootstrap, React, and the future of front-end design.</p>
            <a href="#" class="btn btn-primary">Read More</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white text-center py-3">&copy; 2025 TechTalk Blog</footer>
</body>
</html>
