<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurant Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container py-5 text-center">
    <h2 class="fw-bold mb-4">Today's Menu</h2>
    <img src="https://via.placeholder.com/600x300" class="img-fluid mb-3" alt="Food">
    <p class="lead">Delicious meals freshly made for you.</p>

    <table class="table table-striped mt-4">
      <thead class="table-dark">
        <tr><th>Item</th><th>Category</th><th>Price</th></tr>
      </thead>
      <tbody>
        <tr><td>Margherita Pizza</td><td>Main Course</td><td>$12</td></tr>
        <tr><td>Caesar Salad</td><td>Starter</td><td>$8</td></tr>
        <tr><td>Chocolate Cake</td><td>Dessert</td><td>$6</td></tr>
      </tbody>
    </table>

    <h4 class="mt-5">Chef’s Specials</h4>
    <ul class="list-group w-50 mx-auto">
      <li class="list-group-item">Grilled Salmon</li>
      <li class="list-group-item">Pasta Alfredo</li>
    </ul>
  </div>
</body>
</html>
