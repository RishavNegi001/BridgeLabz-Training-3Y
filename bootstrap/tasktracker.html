<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container py-5">
    <h3 class="mb-4">Tasks <span class="badge bg-secondary">3 Pending</span></h3>

    <ul class="list-group mb-3">
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Complete project report <span class="badge bg-danger">High</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Email clients <span class="badge bg-warning text-dark">Medium</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Organize files <span class="badge bg-success">Low</span>
      </li>
    </ul>

    <button class="btn btn-primary">Completed <span class="badge bg-light text-dark">1</span></button>
  </div>
</body>
</html>
