<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Portfolio</title>

  <!-- ✅ Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark">

  <div class="container text-center mt-4 p-5">
    <!-- 🧑‍💻 Header -->
    <h1 class="fw-bold mb-3">Rishav Negi</h1>
    <p class="lead mb-4">Full Stack Developer | Web Enthusiast | Problem Solver</p>

    <!-- 🖼️ Profile Image -->
    <img src="https://via.placeholder.com/200" alt="Profile Image" class="img-fluid rounded-circle mb-4">

    <!-- 🔘 Buttons -->
    <div class="mb-4">
      <a href="#" class="btn btn-primary me-2">Hire Me</a>
      <a href="#" class="btn btn-outline-dark">Download CV</a>
    </div>

    <!-- ✉️ Contact Form -->
    <form class="mx-auto" style="max-width: 400px;">
      <div class="mb-3">
        <input type="text" class="form-control" placeholder="Your Name">
      </div>
      <div class="mb-3">
        <input type="email" class="form-control" placeholder="Your Email">
      </div>
      <div class="mb-3">
        <textarea class="form-control" rows="3" placeholder="Your Message"></textarea>
      </div>
      <button type="submit" class="btn btn-success w-100">Send Message</button>
    </form>
  </div>

  <!-- ✅ Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
