<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <div class="card p-4">
      <h4 class="mb-4">User Notifications</h4>

      <div class="alert alert-success">✅ New message received!</div>
      <div class="alert alert-info">ℹ️ Tip: Update your profile.</div>
      <div class="alert alert-danger alert-dismissible fade show" role="alert">
        ⚠️ Warning: Low storage!
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <div class="bg-light p-3 border mt-4">
        <h5>Summary</h5>
        <p>3 Notifications — Stay updated with your account.</p>
      </div>
    </div>
  </div>
</body>
</html>
