<!-- 10-dropdown-selection.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dropdown Selection</title>
</head>
<body>
  <header>
    <h1>Location & Favorite Place Selector</h1>
  </header>

  <main>
    <form>
      <label for="country">Country:</label>
      <select id="country" name="country">
        <option value="india" selected>India</option>
        <option value="france">France</option>
        <option value="japan">Japan</option>
      </select>
      <br><br>

      <label for="state">State:</label>
      <select id="state" name="state">
        <option value="karnataka" selected>Karnataka</option>
        <option value="maharashtra">Maharashtra</option>
        <option value="tamilnadu">Tamil Nadu</option>
      </select>
      <br><br>

      <label for="city">City:</label>
      <select id="city" name="city">
        <option value="bengaluru" selected>Bengaluru</option>
        <option value="mumbai">Mumbai</option>
        <option value="chennai">Chennai</option>
      </select>
      <br><br>

      <label for="place">Favorite Tourist Place:</label>
      <select id="place" name="place">
        <option value="garden" selected>Lalbagh Botanical Garden</option>
        <option value="museum">National Museum</option>
        <option value="beach">Marina Beach</option>
      </select>
    </form>

    <p>Selected: Country — India; State — Karnataka; City — Bengaluru; Favorite Place — Lalbagh Botanical Garden.</p>
  </main>

  <footer>
    <p>© 2025 Selector Demo</p>
  </footer>
</body>
</html>
