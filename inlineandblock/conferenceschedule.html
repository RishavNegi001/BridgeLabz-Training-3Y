<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
  <header>

  </header>

  <main>

      <h2>Schedule</h2>

          <tr>
            <th>Session</th>
            <th>Time</th>
            <th>Topic</th>
            <th>Speaker</th>

            <td>13:00 - 15:00</td>

            <td>Panelists</td>

            <td>Evening</td>
            <td>17:00 - 19:00</td>
            <td>Workshop: Hands-on ML</td>
            <td>Ms. Y</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td colspan="4">Note: Schedule subject to change.</td>
          </tr>
        </tfoot>
      </table>
    </section>
  </main>

  <footer>
    <p>© 2025 Conference Organizers</p>
  </footer>

</html>
