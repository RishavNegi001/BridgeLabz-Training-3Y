<!-- 03-course-registration.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Course Registration</title>
</head>
<body>
  <header>
    <h1>Course Registration</h1>
  </header>

  <main>
    <form>
      <fieldset>
        <legend>Student Details</legend>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Your name"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="you@example.com"><br><br>
      </fieldset>

      <fieldset>
        <legend>Course Selection</legend>
        <label for="course">Choose a course:</label>
        <select id="course" name="course">
          <option value="webdev" selected>Web Development</option>
          <option value="datasci">Data Science</option>
          <option value="ml">Machine Learning</option>
        </select>
      </fieldset>

      <p><input type="submit" value="Register"></p>
    </form>

    <h2>Available Course Schedules</h2>
    <table border="1">
      <thead>
        <tr>
          <th>Day</th>
          <th>Time</th>
          <th>Instructor</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Monday</td>
          <td>10:00 - 12:00</td>
          <td>Dr. A</td>
        </tr>
        <tr>
          <td>Wednesday</td>
          <td>14:00 - 16:00</td>
          <td>Ms. B</td>
        </tr>
        <tr>
          <td>Saturday</td>
          <td>09:00 - 11:00</td>
          <td>Mr. C</td>
        </tr>
      </tbody>
    </table>
  </main>

  <footer>
    <p>Contact: courses@example.com</p>
  </footer>
</body>
</html>
