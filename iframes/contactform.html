<!DOCTYPE html>
<html>
<head>
  <title>Contact Form</title>
</head>
<body>
  <form>
    Full Name: <input type="text" placeholder="Enter your name" required><br><br>
    Email: <input type="email" placeholder="Enter your email" required><br><br>
    Subject: <input type="text" placeholder="Subject" required><br><br>
    Message:<br>

    <input type="submit" value="Send">
  </form>
</body>
</html>
