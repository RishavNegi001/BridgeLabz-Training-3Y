<!DOCTYPE html>
<html>
<head>
  <title>My City Map</title>
</head>
<body>
  <h2>My City Location</h2>
  <!-- The 'loading="lazy"' attribute delays loading of the map until it’s visible on screen -->
  <iframe 
    src="https://www.google.com/maps?q=Delhi&output=embed"
    title="Google Map of My City"
    width="80%" height="400" loading="lazy">
  </iframe>
</body>
</html>
