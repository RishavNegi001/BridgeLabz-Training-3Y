<!DOCTYPE html>
<html>
<head>
  <title>Upload Image</title>
</head>
<body>
  <h2>Upload Your Image</h2>
  <form>
    <input type="file" name="file" accept=".jpg,.png" required><br><br>
    <p>Only .jpg or .png image files are allowed.</p>
    <input type="submit" value="Upload">
  </form>
</body>
</html>
