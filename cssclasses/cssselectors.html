<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Selectors Practice</title>
<style>
/* Element selector */
p { color:#333; }
/* Class selector */
.highlight { background:yellow; }
/* ID selector */
#special { color:red; font-weight:bold; }
/* Attribute selector */
a[target="_blank"] { color:green; }
/* Combinators */
ul > li { color:blue; } /* child */
h2 + p { color:orange; } /* adjacent sibling */
</style>
</head>
<body>
<header><h1>CSS Selector Examples</h1></header>
<h2>Basic Selectors</h2>
<p class="highlight">This paragraph uses a class selector.</p>
<p id="special">This paragraph uses an ID selector.</p>
<a href="#" target="_blank">External Link</a>
<h2>Combinators</h2>
<p>Paragraph after h2 changes color.</p>
<ul><li>Child List Item</li><li>Another Item</li></ul>
<footer>End of demo</footer>
</body>
</html>
