<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Styled Buttons</title>
<style>
body { display:flex; justify-content:center; align-items:center;
  gap:20px; height:100vh; background:#f9f9f9; font-family:Arial; }
button {
  padding:10px 20px; border-radius:8px; border:none;
  cursor:pointer; transition:all 0.3s ease; font-weight:bold;
}
.primary { background:#007bff; color:#fff; }
.primary:hover { background:#0056b3; }
.secondary { background:#6c757d; color:#fff; }
.secondary:hover { background:#5a6268; }
.outline { background:transparent; border:2px solid #007bff; color:#007bff; }
.outline:hover { background:#007bff; color:#fff; }
button:focus { outline:3px solid #ffeb3b; }
button:disabled { background:#ccc; color:#777; cursor:not-allowed; }
</style>
</head>
<body>
<button class="primary">Primary</button>
<button class="secondary">Secondary</button>
<button class="outline">Outline</button>
<button disabled>Disabled</button>
</body>
</html>
