<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UI Components</title>
<style>
body {
  height:100vh; display:flex; justify-content:center; align-items:center;
  background:linear-gradient(120deg,#e0f7fa,#fff);
  font-family:Arial;
}
.card {
  background:#fff; padding:20px; border-radius:10px;
  box-shadow:0 3px 8px rgba(0,0,0,0.2);
  display:flex; flex-direction:column; gap:15px; width:300px;
}
input, select, button {
  padding:10px; border-radius:5px; border:1px solid #ccc;
  transition:0.3s ease;
}
input:focus, select:focus, button:hover {
  border-color:#2196f3; outline:none;
}
button {
  background:#2196f3; color:#fff; cursor:pointer;
}
</style>
</head>
<body>
<div class="card">
  <input type="text" placeholder="Search...">
  <select>
    <option>Choose Option</option><option>Option 1</option><option>Option 2</option>
  </select>
  <button>Submit</button>
</div>
</body>
</html>
