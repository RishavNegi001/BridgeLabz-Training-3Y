<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Showcase</title>
<style>
body {
  margin:0; padding:40px;
  display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px; background:#fafafa; font-family:Arial;
}
figure {
  position:relative; overflow:hidden; border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.2); margin:0;
}
figure img {
  width:100%; transition:all 0.3s ease; display:block;
}
figure::after {
  content:""; position:absolute; inset:0;
  background:rgba(0,0,0,0); transition:all 0.3s ease;
}
figure:hover img { transform:scale(1.1); }
figure:hover::after { background:rgba(0,0,0,0.3); }
figcaption {
  text-align:center; padding:10px; background:#fff;
}
</style>
</head>
<body>
<figure><img src="https://picsum.photos/300?1"><figcaption>Nature</figcaption></figure>
<figure><img src="https://picsum.photos/300?2"><figcaption>City</figcaption></figure>
<figure><img src="https://picsum.photos/300?3"><figcaption>Mountains</figcaption></figure>
<figure><img src="https://picsum.photos/300?4"><figcaption>Beach</figcaption></figure>
<figure><img src="https://picsum.photos/300?5"><figcaption>Forest</figcaption></figure>
<figure><img src="https://picsum.photos/300?6"><figcaption>River</figcaption></figure>
</body>
</html>
