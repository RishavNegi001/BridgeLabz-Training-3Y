<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Animations</title>
<style>
body {
  display:flex; justify-content:center; align-items:center;
  gap:40px; height:100vh; background:#eef; font-family:Arial;
}
.box {
  width:80px; height:80px; border-radius:50%; background:#2196f3;
  animation: move 3s ease-in-out infinite alternate;
}
@keyframes move {
  from { transform: translateY(0); }
  to { transform: translateY(-100px); }
}
.text {
  animation: colorChange 4s infinite alternate ease-in-out;
}
@keyframes colorChange {
  0% { color:red; } 50% { color:green; } 100% { color:blue; }
}
.square {
  width:60px; height:60px; background:#ff5722;
  animation: spin 2s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>
<div class="box"></div>
<div class="square"></div>
<h3 class="text">Animated Text</h3>
</body>
</html>
