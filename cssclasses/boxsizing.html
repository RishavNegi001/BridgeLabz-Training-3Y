<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Box-Sizing Comparison</title>
<style>
body {
  display:flex; justify-content:center; align-items:center;
  height:100vh; gap:20px; background:#fafafa; font-family:Arial;
}
.box {
  width:200px; padding:20px; border:5px solid #333;
  background:#bbdefb;
}
.border-box {
  box-sizing:border-box;
  background:#c8e6c9;
}
</style>
</head>
<body>
<div class="box">Default (content-box)</div>
<div class="box border-box">With border-box</div>
</body>
</html>
