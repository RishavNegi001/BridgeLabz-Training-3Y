<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pseudo-Classes Demo</title>
<style>
body {
  display: flex;
  justify-content: space-around;
  align-items: flex-start;
  padding: 40px;
  font-family: Arial;
}
.example {
  width: 180px;
  text-align: center;
}
a, button, li {
  display: inline-block;
  padding: 10px 15px;
  margin-top: 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
  transition: 0.3s ease;
}
a:hover { background: #4caf50; color: white; }       /* :hover */
button:active { background: #f44336; color: white; } /* :active */
input:focus { border-color: #2196f3; outline: none; }/* :focus */
li:nth-child(even) { background: #eee; }             /* :nth-child */
</style>
</head>
<body>
<div class="example">
  <h3>:hover</h3>
  <a href="#">Hover over me</a>
</div>
<div class="example">
  <h3>:focus</h3>
  <input type="text" placeholder="Click to focus">
</div>
<div class="example">
  <h3>:active</h3>
  <button>Click me</button>
</div>
<div class="example">
  <h3>:nth-child()</h3>
  <ul>
    <li>Item 1</li><li>Item 2</li><li>Item 3</li><li>Item 4</li>
  </ul>
</div>
</body>
</html>
