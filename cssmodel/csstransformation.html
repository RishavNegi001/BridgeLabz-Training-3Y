<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transformations</title>
<style>
body {
  display: flex; justify-content: center; align-items: center;
  gap: 30px; height: 100vh; background: #fafafa; font-family: Arial;
}
.box {
  width:100px; height:100px; background:#2196f3; color:#fff;
  display:flex; justify-content:center; align-items:center;
  transition: all 0.4s ease; flex-direction: column;
}
.rotate:hover { transform: rotate(45deg); }
.scale:hover { transform: scale(1.3); }
.translate:hover { transform: translate(30px, -20px); }
.skew:hover { transform: skew(20deg, 10deg); }
label { margin-top:10px; font-size:14px; color:#333; }
</style>
</head>
<body>
<div class="box rotate">↻<label>rotate()</label></div>
<div class="box scale">⇱<label>scale()</label></div>
<div class="box translate">⇆<label>translate()</label></div>
<div class="box skew">⤴<label>skew()</label></div>
</body>
</html>
