<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gradient Backgrounds</title>
<style>
body,html { margin:0; padding:0; height:100%; font-family:sans-serif; color:#fff; }
header,footer {
  position:fixed; left:0; right:0; background:#222; text-align:center; padding:10px;
}
header { top:0; }
footer { bottom:0; }
.section {
  height:100vh; display:flex; justify-content:center; align-items:center;
  font-size:2em;
}
.linear { background: linear-gradient(45deg, #ff5722, #ff9800); }
.radial {
  background: radial-gradient(circle, #2196f3, #3f51b5);
  background-attachment: fixed;
}
</style>
</head>
<body>
<header>Fixed Header</header>
<section class="section linear">Linear Gradient Section</section>
<section class="section radial">Radial Gradient (Parallax Effect)</section>
<footer>Fixed Footer</footer>
</body>
</html>
