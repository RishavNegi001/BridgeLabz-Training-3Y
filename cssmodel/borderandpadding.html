<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Borders and Padding Demonstration</title>
<style>
body {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 40px;
  background: #f9f9f9;
  font-family: Arial;
}
.box {
  width: 120px;
  height: 120px;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: border-color 0.3s ease;
}
.solid { border: 4px solid #007bff; }
.dashed { border: 4px dashed #28a745; border-radius: 10px; }
.double { border: 6px double #ff9800; border-radius: 25px; }
.groove { border: 6px groove #e91e63; border-radius: 50%; }

.box:hover { border-color: black; }
</style>
</head>
<body>
<div class="box solid">Solid</div>
<div class="box dashed">Dashed</div>
<div class="box double">Double</div>
<div class="box groove">Groove</div>
</body>
</html>
